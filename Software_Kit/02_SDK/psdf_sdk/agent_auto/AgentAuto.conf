# AgentAuto default configuration.
#
# Rules:
# 1. Values are injected only when the user has not already provided the
#    same CLI option in the command.
# 2. [default] stores machine/project defaults such as SDK root, project,
#    CDK directory, and COM port. Empty values are ignored.
# 3. Each command section stores options specific to that first-level
#    command. hif send/enter/parse have their own sections.
# 4. Merge order is [default] -> [base module] -> [subcommand]. A later
#    section overrides an earlier one with the same option key.
#
# Effective priority:
#   command line > AgentAuto.conf > environment variables > auto discovery
#
# Environment variables:
#   AGENT_AUTO_SDK_ROOT   SDK root containing project/ and platform/
#   AGENT_AUTO_CDK        absolute path to cdk-make.exe
#   CDK_MAKE              compatibility alias for AGENT_AUTO_CDK
#   AGENT_AUTO_DLL        absolute path to DownloadLib.dll
#   AGENT_AUTO_PYTHON     python.exe used by AgentAuto.cmd / agentcore.cmd
#   AGENT_AUTO_CONFIG     alternate path to this config file
#   AGENT_AUTO_SKILLS     AI Skill install destination
#
# Example:
# [default]
# sdk = D:\path\to\psic_sdk3
# project = D:\path\to\psic_sdk3\project\hello_word
# config = D:\path\to\psic_sdk3\project\hello_word\cdk_6130_1812_cpus
# port = COM109
#
# New-machine workflow:
#   1. Put this folder inside the SDK when possible.
#   2. Run: .\AgentAuto.cmd discover
#   3. Run: .\AgentAuto.cmd doctor
#   4. Run: .\AgentAuto.cmd ports
#   5. Confirm the project path and the CDK directory, then use
#      build/burn/workflow.

[default]
sdk =
cdk =
dll =
project =
config =
port =
console-port =

[upgrade]
mode = shell
# baud = 115200
shell-command = upgrade
enter-hex = A5 40 15 04 01 00 02 E8 FB FE FF
line-ending = CRLF
verify = auto
read-timeout-ms = 4000

[burn]
baud = 921600
shell-baud = 115200
# Optional local staging. Default is direct burn with the SDK DLL and original image path.
# copy-dir = D:\path\to\local\staging
retry = 3
wait-ack-timeout = 5000
read-back-check = true
download-finish-start = true
auto-reset = true
kill-before-start = true
enter-mode =
enter-verify = auto
enter-wait-ms = 3000
enter-read-timeout-ms = 4000

[monitor]
baud = 115200
duration = 10
idle-timeout = 3
until-text =
out =
hex = false
no-timestamp = false
max-bytes =

[hif]
baud = 921600
read-timeout-ms =
verify =
line-ending =

[hif-send]
hex =

[hif-enter]
hex = A5 40 15 04 01 00 02 E8 FB FE FF

[hif-parse]
msg-id =
raw = false
bins = false
json = false

[build]
config =
skip-prepare = false
skip-shell = false
skip-cdkproj = false
skip-modules = false

[prepare]
skip-shell = false
skip-cdkproj = false
skip-modules = false

[send]
baud = 115200
verify =
hif-wake = false
line-ending = CRLF
read-timeout-ms = 1500

[brom-send]
baud = 921600
read-timeout-ms = 5000
verbose = false
dry-run = false

[reset]
baud = 921600
shell-baud = 115200
enter-mode = shell
enter-verify = auto
enter-shell-command = upgrade
boot-wait = 3
enter-read-timeout-ms = 4000

[parse-hif]
msg-id =
raw = false
bins = false
json = false

[workflow]
# burn-baud =
# shell-baud =
# monitor-port =
# monitor-baud =
# monitor-duration =
# monitor-out =
auto-reset = true
