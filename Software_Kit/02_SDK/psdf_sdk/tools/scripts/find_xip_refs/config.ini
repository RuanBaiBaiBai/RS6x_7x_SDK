; ============================================================
; find_xip_refs.py 配置文件
; 编码: UTF-8   注释行以 ; 或 # 开头
; ============================================================

[input]
; 起始函数名。命令行未传函数名时使用此处的值
; 例: func = mmw_point_cloud_process
func = mmw_point_cloud_process

; 待解析的反汇编 (.asm/.lst) 文件，建议填绝对路径
; 例: asm = D:\Test\psdf.asm
asm = D:\Test\psdf.asm

[output]
; 输出 CSV 路径。留空则自动用 “<函数名>_xip.csv”
; 例: csv = D:\Test\result.csv
csv =D:\Test\result.csv

[exclude]
; 递归时要排除的函数：命中后直接跳过(不打印/不计数/不递归)
; 一行一个，缩进对齐；# 开头为注释；支持 fnmatch 通配 (printf*  lib_*  *_init)
functions =
    printf
